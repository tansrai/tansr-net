name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and push Tansr.Sdk 0.2.x
    runs-on: windows-2025
    environment: nuget
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install SDK selected by global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Tansr
      - name: Pack
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'nupkg'
          New-Item -ItemType Directory -Force $out | Out-Null
          dotnet pack src/Tansr.Sdk/Tansr.Sdk.csproj -c Release -o $out --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack src/Tansr.Sdk.Windows/Tansr.Sdk.Windows.csproj -c Release -o $out --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NUPKG_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Push
        run: |
          $pkgs = Get-ChildItem -LiteralPath $env:NUPKG_DIR -Filter *.nupkg
          if ($pkgs.Count -ne 2) { throw "expected 2 nupkg, got $($pkgs.Count)" }
          $pkgs | ForEach-Object { dotnet nuget push $_.FullName --api-key "$env:NUGET_API_KEY" --source https://www.nuget.org/api/v2/package --skip-duplicate }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}